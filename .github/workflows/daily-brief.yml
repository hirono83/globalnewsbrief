name: Daily global news briefing

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: Asia/Seoul
  workflow_dispatch:
    inputs:
      focus:
        description: "추가로 깊게 볼 카테고리(선택)"
        required: false
        type: string

concurrency:
  group: daily-global-news-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set run context
        id: clock
        shell: bash
        run: |
          echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"
          echo "run_at=$(date --iso-8601=seconds)" >> "$GITHUB_OUTPUT"

      - name: Prepare prompt
        shell: bash
        env:
          RUN_AT: ${{ steps.clock.outputs.run_at }}
          FOCUS: ${{ inputs.focus }}
        run: |
          {
            printf '# 실행 컨텍스트\n\n'
            printf -- '- 기준 시각: %s (Asia/Seoul)\n' "$RUN_AT"
            printf -- '- 추가 관심 카테고리: %s\n\n' "${FOCUS:-없음}"
            cat .github/codex/prompts/global-news-briefing.md
          } > run-prompt.md

      - name: Generate briefing with Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: run-prompt.md
          output-file: codex-output.md
          codex-args: '["--search", "--ephemeral"]'
          model: gpt-5.5
          effort: high
          sandbox: read-only

      - name: Validate and save report
        shell: bash
        env:
          REPORT_DATE: ${{ steps.clock.outputs.date }}
        run: |
          test -s codex-output.md
          required=(
            "## 6-1. 오늘의 한 문장"
            "## 6-2. 핵심 사건 5"
            "## 6-3. 카테고리별 글로벌 브리프"
            "## 6-4. 시장 전달경로"
            "## 6-5. PEST Quick View"
            "## 6-6. 반대 근거와 불확실성"
            "## 6-7. 다음 확인 일정"
            "## 6-8. Coverage Audit"
            "[글로벌]" "[미국]" "[유럽]" "[중국]" "[일본]"
            "[한국]" "[암호화폐]" "[채권·금리]" "[원자재]" "[IT·테크]"
          )
          for text in "${required[@]}"; do
            grep -Fq "$text" codex-output.md || { echo "Missing: $text"; exit 1; }
          done
          mkdir -p reports
          mv codex-output.md "reports/${REPORT_DATE}.md"

      - name: Commit report
        shell: bash
        env:
          REPORT_DATE: ${{ steps.clock.outputs.date }}
        run: |
          report="reports/${REPORT_DATE}.md"
          git add -- "$report"
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "briefing: ${REPORT_DATE}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
